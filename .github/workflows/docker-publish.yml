name: Build Docker Image (amd64 tar)

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: nowen:custom
          load: true
          provenance: false

      - name: Pack image as tar.gz
        run: |
          docker save nowen:custom | gzip > nowen-custom-amd64.tar.gz
          ls -lh nowen-custom-amd64.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowen-custom-amd64
          path: nowen-custom-amd64.tar.gz
          retention-days: 30
          compression-level: 0
